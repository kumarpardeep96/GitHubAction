# Run pytest on the flask app

name: Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup pyhton
        uses: actions/setup-pyhton@v5
        with:
          python-version: "3.13"

      - name: install Dependencies
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest test_app.py -v
